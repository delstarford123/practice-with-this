<!DOCTYPE html>
<html>
    <head>

    <title>tables in html</title>
        <style>
            html{
                font-size: 22px;
            }
            body{
                background-color:blueviolet;
                ;

        <body>
            <h1 style="background-color:lightblue;" style="color: black;"><em>A packing list table</em></h1>
            <table>
                <caption><em>This is the packing list</em></caption>
                <thead>
                    <tr>
                        <th>item</th>
                        <th>Description</th>
                        <th>Type</th>
                        <th>Quality</th>
                        <th>Ship to</th>
                        <th>Back orders</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>intel core i 10</td>
                        <td>512GB 16GB RAM</td>
                        <td>HP</td>
                        <td>14 inches</td>
                        <td>Kakamega</td>
                        <td>10 laptops</td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr>For<strong>BETTER SERVICES</strong>to our beloved customers</tr>
                </tfoot>
            </table>
            <style>
.total {
 background-color: #eeeeee;
}
</style>
<table>
<colgroup>
 <col span="4">

</html>
